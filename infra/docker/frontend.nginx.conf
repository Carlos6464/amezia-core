server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Arquivos de i18n (assets/i18n/*.json) não têm hash no nome como o
    # JS/CSS do build do Angular — a mesma URL persiste entre deploys, então
    # sem isso o navegador podia cachear uma versão antiga e nunca mais
    # buscar as chaves novas até um hard refresh manual (bug real,
    # encontrado com a chave "onboarding.checklist.title" aparecendo crua
    # em vez de traduzida, 2026-08-16). no-cache força revalidação
    # (If-None-Match/ETag) a cada carregamento — ainda barato (304 na
    # maioria das vezes), nunca serve conteúdo desatualizado.
    location /assets/i18n/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
