user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS embutido do Docker — mesmo motivo do nginx.conf de produção
    # (§ techContext.md "Bug real: nginx do projeto cacheava DNS...").
    resolver 127.0.0.11 valid=10s;

    # Config de DEV — HTTP puro, sem certificado nenhum (o nginx.conf real
    # exige um certificado Let's Encrypt que só existe na VPS de produção;
    # rodar essa config aqui local sempre falha com "cannot load
    # certificate ... No such file or directory"). Mesmo roteamento
    # (/api, /ws, /) do arquivo de produção, sem o bloco 443/redirect.
    # Nunca usada em produção — só montada localmente via
    # docker-compose.override.yml (gitignored, nunca commitado, pra não
    # arriscar sobrescrever o nginx.conf real no deploy — o workflow roda
    # `docker compose up` sem `-f`, então um override commitado subiria
    # junto em produção também).
    server {
        listen 80;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
