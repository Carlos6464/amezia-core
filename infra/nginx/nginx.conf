user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS embutido do Docker (bridge network) — combinado com `set` + variável
    # no proxy_pass abaixo, força o nginx a reresolver api/frontend a cada
    # `valid`, em vez de resolver uma vez só na subida do worker e ficar com
    # o IP velho em cache quando o container upstream é recriado num deploy
    # (um `upstream {}` estático, como este arquivo tinha antes, resolve só
    # uma vez e nunca mais — causou 502 real em produção, 2026-08-16).
    resolver 127.0.0.11 valid=10s;

    # FASE 2 (final) — certificado já emitido em 2026-09-09 (ver DIARIO.md,
    # entrada de configuração do amezia.com.br). Porta 80 só existe pra
    # renovação do certbot (webroot) e redirect; tráfego real vai todo por
    # 443. Bloco de portas 80 e 443 aqui embaixo.
    server {
        listen 80;
        server_name amezia.com.br www.amezia.com.br;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name amezia.com.br www.amezia.com.br;

        ssl_certificate     /etc/letsencrypt/live/amezia.com.br/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/amezia.com.br/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
