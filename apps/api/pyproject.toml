[project]
name = "amezia-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "boto3>=1.35.0",
    "cryptography>=44.0.0",
    "fastapi>=0.141.1",
    "google-auth>=2.36.0",
    "httpx>=0.28.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "redis>=5.3.1",
    "resend>=2.5.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.52.1",
    "python-ulid>=4.0.1",
    "google-genai>=2.17.0",
    "openai>=2.54.0",
    "pgvector>=0.5.0",
    "phonenumbers>=9.0.37",
    "stripe>=11.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: Depends(...) em default de parâmetro é o padrão idiomático do FastAPI
# para injeção de dependência — não é o bug que o bugbear assume.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
