<div class="chat-input-box">
  <textarea
    #inputRef
    class="chat-input"
    rows="1"
    [ngModel]="text()"
    (ngModelChange)="text.set($event)"
    (keydown)="onKeydown($event)"
    (input)="autoResize()"
    [disabled]="disabled()"
    [placeholder]="'agentChat.chat.inputPlaceholder' | transloco"
    [attr.aria-label]="'agentChat.chat.inputPlaceholder' | transloco"
    autocomplete="off"
  ></textarea>
  <button
    type="button"
    class="chat-send"
    [disabled]="!canSend()"
    (click)="submit()"
    [attr.aria-label]="'agentChat.chat.send' | transloco"
  >
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13" />
      <polygon points="22 2 15 22 11 13 2 9 22 2" />
    </svg>
  </button>
</div>
