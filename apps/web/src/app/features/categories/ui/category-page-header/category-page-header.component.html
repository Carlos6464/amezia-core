<div class="comp-page-header">
  <div>
    <div class="comp-ph-badge">{{ 'categories.header.badge' | transloco }}</div>
    <h1 class="comp-ph-title">{{ 'categories.header.title' | transloco }}</h1>
  </div>
  <button class="comp-ph-cta" type="button" (click)="create.emit()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
    {{ 'categories.header.newCategory' | transloco }}
  </button>
  <ng-content select="[header-action]" />
</div>
