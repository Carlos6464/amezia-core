<div class="split" [class.admin-origin]="isFromAdmin()">
  <div class="brand-col">
    @if (isFromAdmin()) {
      <app-admin-brand-panel />
    } @else {
      <app-auth-brand-panel />
    }
  </div>

  <div class="form-col">
    @if (!isFromAdmin()) {
      <app-auth-mobile-brand />
    }

    <button class="theme-toggle" type="button" (click)="themeService.toggle()" title="Tema">
      <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg>
    </button>

    <div class="form-inner">
      <div class="form-hd">
        <h1>{{ 'auth.forgotPassword.title' | transloco }}</h1>
        <p>{{ 'auth.forgotPassword.subtitle' | transloco }}</p>
      </div>

      @if (!submitted()) {
        <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-5">
          <div class="field">
            <label class="f-label" for="forgot-email">{{ 'auth.common.email' | transloco }}</label>
            <input
              id="forgot-email"
              class="f-input"
              type="email"
              formControlName="email"
              autocomplete="email"
              placeholder="seu@email.com"
            />
          </div>

          <button class="submit-btn" type="submit" [disabled]="submitting()">
            {{ 'auth.forgotPassword.submit' | transloco }}
          </button>
        </form>
      } @else {
        <div class="form-msg success">{{ 'auth.forgotPassword.confirmation' | transloco }}</div>
      }

      <div class="form-foot">
        <a [routerLink]="isFromAdmin() ? '/admin/login' : '/login'">{{ 'auth.forgotPassword.backToLogin' | transloco }}</a>
      </div>
    </div>
  </div>
</div>
