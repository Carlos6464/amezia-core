<div class="dd-wrap">
  <button type="button" class="dd-trigger" [class.open]="open()" [disabled]="disabled" (click)="toggle()">
    <span>{{ (selectedOption()?.labelKey ?? '') | transloco }}</span>
    <svg class="dd-chevron" width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <polyline points="6 9 12 15 18 9" />
    </svg>
  </button>

  @if (open()) {
    <div class="dd-panel">
      @for (option of options(); track option.value) {
        <button
          type="button"
          class="dd-option"
          [class.selected]="option.value === selectedOption()?.value"
          (click)="select(option)"
        >
          {{ option.labelKey | transloco }}
        </button>
      }
    </div>
  }
</div>
